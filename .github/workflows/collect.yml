name: Collect Disneyland Paris wait times

on:
  schedule:
    # 07:00-21:45 UTC = 09:00-23:45 in Paris during CEST (through September).
    # The collector itself also guards against overnight runs.
    - cron: "*/15 7-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disneyland-paris-wait-times
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect current wait times
        run: python collector.py

      - name: Commit new observations
        shell: bash
        run: |
          if git diff --quiet -- data/wait_times.csv; then
            echo "No new data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wait_times.csv
          git commit -m "Collect wait times $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
