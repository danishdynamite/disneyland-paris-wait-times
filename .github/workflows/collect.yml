name: Collect Disneyland Paris wait times

on:
  schedule:
    # GitHub Actions cron is UTC. During CEST, 07:07-21:52 UTC = 09:07-23:52 in Paris.
    # Offset from :00/:15/:30/:45 to reduce scheduler contention.
    - cron: "7,22,37,52 7-21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: disneyland-paris-wait-times
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Show trigger and time
        shell: bash
        run: |
          echo "Trigger: ${{ github.event_name }}"
          echo "UTC time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          TZ=Europe/Paris date '+Paris time: %Y-%m-%d %H:%M:%S %Z'

      - name: Collect current wait times
        run: python collector.py

      - name: Commit new observations
        shell: bash
        run: |
          if git diff --quiet -- data/wait_times.csv; then
            echo "No new data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wait_times.csv
          git commit -m "Collect wait times $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
